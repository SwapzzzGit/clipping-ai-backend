[project]
name = "clipper"
version = "0.1.0"
description = "Turn a YouTube podcast URL into vertical short-form clips"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",   # speech-to-text for uploaded videos
    "rapidocr-onnxruntime>=1.4",   # reads captions already burned into the picture
    # Caption styles (clipper/pycaps_captions.py). PyPI's "pycaps" is an unrelated package, so this is the GitHub release.
    "pycaps @ git+https://github.com/francozanardi/pycaps@e2d36edfa08e3307d65b15bb20f17399dc2c9b40",
    "playwright>=1.40",            # pycaps draws its captions in a headless browser (run: python -m playwright install chromium)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Fallback ffmpeg binary when ffmpeg is not on PATH.
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders a real video with pycaps (about a minute)"]
